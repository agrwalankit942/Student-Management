
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Student Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 span {
            color: #93c5fd;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 29px;
            margin-bottom: 8px;
            color: #172554;
        }

        .heading p {
            color: #64748b;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .error {
            display: block;
            color: #dc2626;
            font-size: 12px;
            margin-top: 6px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .save-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            flex: 1;
            padding: 14px;
            border-radius: 7px;
            background: #e2e8f0;
            color: #1e293b;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <h2>Student<span>Management</span></h2>
        <a href="/students">Dashboard</a>
    </nav>

    <div class="container">

        <div class="heading">
            <h1 th:text="${student.id == 0 ? 'Add New Student' : 'Update Student'}">
                Add New Student
            </h1>

            <p>Enter the student information below.</p>
        </div>

        <div class="form-card">

            <form th:action="@{/students/save}"
                  th:object="${student}"
                  method="post">

                <!-- Hidden ID for updating -->
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label>Full Name</label>

                    <input type="text"
                           th:field="*{name}"
                           placeholder="Enter student name"
                           required>

                    <span class="error"
                          th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}">
                    </span>
                </div>

                <div class="form-group">
                    <label>Email Address</label>

                    <input type="email"
                           th:field="*{email}"
                           placeholder="Enter email address"
                           required>

                    <span class="error"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}">
                    </span>
                </div>

                <div class="form-group">
                    <label>Course</label>

                    <input type="text"
                           th:field="*{course}"
                           placeholder="Example: MCA, BCA, BBA"
                           required>

                    <span class="error"
                          th:if="${#fields.hasErrors('course')}"
                          th:errors="*{course}">
                    </span>
                </div>

                <div class="form-group">
                    <label>City</label>

                    <input type="text"
                           th:field="*{city}"
                           placeholder="Enter your city"
                           required>

                    <span class="error"
                          th:if="${#fields.hasErrors('city')}"
                          th:errors="*{city}">
                    </span>
                </div>

                <div class="buttons">

                    <button type="submit" class="save-btn">
                        Save Student
                    </button>

                    <a href="/students" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

    <footer>
        © 2026 Student Management System
    </footer>

</body>
</html>
