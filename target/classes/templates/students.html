
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students | Student Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 span {
            color: #93c5fd;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1150px;
            margin: 45px auto;
            padding: 20px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 13px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        .search-box button {
            padding: 12px 22px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .clear-btn {
            padding: 12px 18px;
            background: #e2e8f0;
            color: #1e293b;
            border-radius: 7px;
            text-decoration: none;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .table-card h2 {
            margin-bottom: 20px;
            color: #172554;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .edit-btn, .delete-btn {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            margin: 2px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 650px) {
            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .search-box {
                flex-wrap: wrap;
            }

            .search-box input {
                min-width: 100%;
            }

            .container {
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <h2>Student<span>Management</span></h2>
        <a href="/students">Dashboard</a>
    </nav>

    <div class="container">

        <!-- Heading -->
        <div class="heading">
            <div>
                <h1>Student Management</h1>
                <p>Manage all college student records.</p>
            </div>

            <a href="/students/new" class="add-btn">
                + Add New Student
            </a>
        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="message success"
             th:text="${successMessage}">
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}"
             class="message error"
             th:text="${errorMessage}">
        </div>

        <!-- Search Form -->
        <form class="search-box" action="/students" method="get">

            <input type="text"
                   name="keyword"
                   placeholder="Search by student name or email..."
                   th:value="${keyword}">

            <button type="submit">Search</button>

            <a href="/students" class="clear-btn">Clear</a>

        </form>

        <!-- Student Table -->
        <div class="table-card">

            <h2>All Students</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>City</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="student : ${students}">

                        <td th:text="${student.id}"></td>

                        <td th:text="${student.name}"></td>

                        <td th:text="${student.email}"></td>

                        <td th:text="${student.course}"></td>

                        <td th:text="${student.city}"></td>

                        <td>
                            <a th:href="@{/students/edit/{id}(id=${student.id})}"
                               class="edit-btn">
                                Edit
                            </a>

                            <a th:href="@{/students/delete/{id}(id=${student.id})}"
                               class="delete-btn"
                               onclick="return confirm('Are you sure you want to delete this student?')">
                                Delete
                            </a>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="empty">
                            No student records found.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <footer>
        © 2026 Student Management System | Spring Boot MVC
    </footer>

</body>
</html>
